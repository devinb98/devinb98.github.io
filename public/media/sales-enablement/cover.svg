<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A rep's source documents on the left feed an action plan on the right, where each step carries a citation back to its source.">
  <style>
    :root { --bg:#f6f7f9; --ink:#1a1e24; --muted:#5b636d; --faint:#9aa1ab; --line:#c6ccd4; --accent:#2f5bd0; --soft:#e5ebfa; --node:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1b1f26; --ink:#e8eaed; --muted:#a3abb6; --faint:#6a727d; --line:#333b45; --accent:#7aa0f5; --soft:#223052; --node:#222730; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--node); stroke: var(--line); stroke-width: 1.5; }
    .plan { fill: var(--node); stroke: var(--accent); stroke-width: 1.75; }
    .title { fill: var(--ink); font-family: 'Archivo', system-ui, sans-serif; font-weight: 650; font-size: 19px; }
    .doc { fill: var(--muted); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; }
    .num { fill: var(--accent); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; }
    .textline { stroke: var(--faint); stroke-width: 5; stroke-linecap: round; opacity: 0.5; }
    .planline { stroke: var(--muted); stroke-width: 5; stroke-linecap: round; opacity: 0.65; }
    .link { stroke: var(--accent); stroke-width: 1.25; fill: none; opacity: 0.5; stroke-dasharray: 3 3; }
    .chip { fill: var(--soft); stroke: var(--accent); stroke-width: 1; }
    .cite { fill: var(--accent); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; }
    .heading { fill: var(--ink); font-family: 'Archivo', system-ui, sans-serif; font-weight: 650; font-size: 15px; }
  </style>
  <rect class="bg" x="0" y="0" width="800" height="500" rx="10" />

  <!-- source documents -->
  <text class="doc" x="70" y="58">sources</text>
  <g>
    <rect class="card" x="70" y="72" width="168" height="78" rx="7" />
    <text class="doc" x="86" y="98">notes</text>
    <line class="textline" x1="86" y1="118" x2="214" y2="118" />
    <line class="textline" x1="86" y1="132" x2="186" y2="132" />
  </g>
  <g>
    <rect class="card" x="70" y="186" width="168" height="78" rx="7" />
    <text class="doc" x="86" y="212">profile.pdf</text>
    <line class="textline" x1="86" y1="232" x2="214" y2="232" />
    <line class="textline" x1="86" y1="246" x2="176" y2="246" />
  </g>
  <g>
    <rect class="card" x="70" y="300" width="168" height="78" rx="7" />
    <text class="doc" x="86" y="326">rfp.pdf</text>
    <line class="textline" x1="86" y1="346" x2="214" y2="346" />
    <line class="textline" x1="86" y1="360" x2="196" y2="360" />
  </g>

  <!-- citation links (every step traces back to a source) -->
  <path class="link" d="M672,168 C320,168 300,111 238,111" />
  <path class="link" d="M672,248 C320,248 300,225 238,225" />
  <path class="link" d="M672,328 C320,328 300,339 238,339" />

  <!-- action plan -->
  <rect class="plan" x="372" y="72" width="356" height="306" rx="9" />
  <text class="heading" x="396" y="112">Action plan</text>
  <line class="textline" x1="396" y1="128" x2="520" y2="128" opacity="0.35" />

  <!-- step 1 -->
  <text class="num" x="396" y="172">01</text>
  <line class="planline" x1="428" y1="168" x2="636" y2="168" />
  <rect class="chip" x="648" y="156" width="56" height="22" rx="5" />
  <text class="cite" x="676" y="171" text-anchor="middle">p.2</text>

  <!-- step 2 -->
  <text class="num" x="396" y="252">02</text>
  <line class="planline" x1="428" y1="248" x2="636" y2="248" />
  <rect class="chip" x="648" y="236" width="56" height="22" rx="5" />
  <text class="cite" x="676" y="251" text-anchor="middle">p.5</text>

  <!-- step 3 -->
  <text class="num" x="396" y="332">03</text>
  <line class="planline" x1="428" y1="328" x2="636" y2="328" />
  <rect class="chip" x="648" y="316" width="56" height="22" rx="5" />
  <text class="cite" x="676" y="331" text-anchor="middle">p.1</text>

  <text class="doc" x="372" y="416">every step cites the passage that justifies it</text>
</svg>
