<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Vertical pipeline: Gmail inbox into a Parser, Summarizer, then Editor agent, which sends a digest back to Gmail.">
  <style>
    :root { --bg:#f6f7f9; --ink:#1a1e24; --muted:#5b636d; --line:#c6ccd4; --accent:#2f5bd0; --node:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1b1f26; --ink:#e8eaed; --muted:#a3abb6; --line:#333b45; --accent:#7aa0f5; --node:#222730; }
    }
    .bg { fill: var(--bg); }
    .node { fill: var(--node); stroke: var(--line); stroke-width: 1.5; }
    .agent { stroke: var(--accent); stroke-width: 1.75; }
    .title { fill: var(--ink); font-family: 'Archivo', system-ui, sans-serif; font-weight: 650; font-size: 20px; }
    .label { fill: var(--muted); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; }
    .step { fill: var(--accent); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; }
    .flow { stroke: var(--line); stroke-width: 1.75; fill: none; }
    .arrow { fill: var(--line); }
  </style>
  <rect class="bg" x="0" y="0" width="800" height="500" rx="10" />
  <defs>
    <marker id="d" markerWidth="10" markerHeight="10" refX="5" refY="8.5" orient="auto">
      <path class="arrow" d="M0,0 L10,0 L5,9 Z" />
    </marker>
  </defs>

  <!-- connectors -->
  <line class="flow" x1="400" y1="92"  x2="400" y2="118" marker-end="url(#d)" />
  <line class="flow" x1="400" y1="182" x2="400" y2="208" marker-end="url(#d)" />
  <line class="flow" x1="400" y1="272" x2="400" y2="298" marker-end="url(#d)" />
  <line class="flow" x1="400" y1="362" x2="400" y2="388" marker-end="url(#d)" />

  <!-- Gmail inbox -->
  <rect class="node" x="250" y="34" width="300" height="56" rx="8" />
  <text class="title" x="400" y="62" text-anchor="middle">Gmail</text>
  <text class="label" x="400" y="80" text-anchor="middle">inbox</text>

  <!-- Parser -->
  <rect class="node agent" x="250" y="124" width="300" height="56" rx="8" />
  <text class="title" x="400" y="152" text-anchor="middle">Parser</text>
  <text class="label" x="400" y="170" text-anchor="middle">clean text</text>
  <text class="step" x="566" y="157">01</text>

  <!-- Summarizer -->
  <rect class="node agent" x="250" y="214" width="300" height="56" rx="8" />
  <text class="title" x="400" y="242" text-anchor="middle">Summarizer</text>
  <text class="label" x="400" y="260" text-anchor="middle">condense each</text>
  <text class="step" x="566" y="247">02</text>

  <!-- Editor -->
  <rect class="node agent" x="250" y="304" width="300" height="56" rx="8" />
  <text class="title" x="400" y="332" text-anchor="middle">Editor</text>
  <text class="label" x="400" y="350" text-anchor="middle">stitch into one digest</text>
  <text class="step" x="566" y="337">03</text>

  <!-- Gmail digest -->
  <rect class="node" x="250" y="394" width="300" height="56" rx="8" />
  <text class="title" x="400" y="422" text-anchor="middle">Gmail</text>
  <text class="label" x="400" y="440" text-anchor="middle">digest, sent back</text>

  <text class="label" x="250" y="480">langgraph / claude / daily cron</text>
</svg>
