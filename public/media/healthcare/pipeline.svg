<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Data pipeline: Google Drive to AWS Lambda to AWS Glue to Snowflake to Streamlit dashboards.">
  <style>
    :root { --bg:#f4ecda; --ink:#2b271e; --muted:#5b5340; --line:#d0bd97; --accent:#3f6630; --node:#fbf6ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#2a261d; --ink:#ece3d0; --muted:#b5ad98; --line:#3c3528; --accent:#a6cb8c; --node:#332e23; }
    }
    .bg { fill: var(--bg); }
    .node { fill: var(--node); stroke: var(--line); stroke-width: 1.5; }
    .hub { stroke: var(--accent); stroke-width: 1.75; }
    .title { fill: var(--ink); font-family: 'Archivo', system-ui, sans-serif; font-weight: 650; font-size: 20px; }
    .label { fill: var(--muted); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; }
    .flow { stroke: var(--line); stroke-width: 1.75; fill: none; }
    .arrow { fill: var(--line); }
  </style>
  <rect class="bg" x="0" y="0" width="800" height="500" rx="10" />
  <defs>
    <marker id="d" markerWidth="10" markerHeight="10" refX="5" refY="8.5" orient="auto">
      <path class="arrow" d="M0,0 L10,0 L5,9 Z" />
    </marker>
  </defs>

  <line class="flow" x1="400" y1="92"  x2="400" y2="118" marker-end="url(#d)" />
  <line class="flow" x1="400" y1="182" x2="400" y2="208" marker-end="url(#d)" />
  <line class="flow" x1="400" y1="272" x2="400" y2="298" marker-end="url(#d)" />
  <line class="flow" x1="400" y1="362" x2="400" y2="388" marker-end="url(#d)" />

  <rect class="node" x="250" y="34" width="300" height="56" rx="8" />
  <text class="title" x="400" y="62" text-anchor="middle">Google Drive</text>
  <text class="label" x="400" y="80" text-anchor="middle">15 nursing datasets</text>

  <rect class="node" x="250" y="124" width="300" height="56" rx="8" />
  <text class="title" x="400" y="152" text-anchor="middle">AWS Lambda</text>
  <text class="label" x="400" y="170" text-anchor="middle">ingest</text>

  <rect class="node" x="250" y="214" width="300" height="56" rx="8" />
  <text class="title" x="400" y="242" text-anchor="middle">AWS Glue</text>
  <text class="label" x="400" y="260" text-anchor="middle">transform</text>

  <rect class="node hub" x="250" y="304" width="300" height="56" rx="8" />
  <text class="title" x="400" y="332" text-anchor="middle">Snowflake</text>
  <text class="label" x="400" y="350" text-anchor="middle">single source of truth</text>

  <rect class="node" x="250" y="394" width="300" height="56" rx="8" />
  <text class="title" x="400" y="422" text-anchor="middle">Streamlit</text>
  <text class="label" x="400" y="440" text-anchor="middle">readmission / staffing / ratios</text>
</svg>
